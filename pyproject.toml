[project]
name = "livechat-mcp"
version = "0.1.0"
description = "MCP server that streams local-Whisper transcriptions to Claude as utterance-based prompts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "silero-vad>=5.1.2",
    "torch>=2.2",
]

[project.scripts]
livechat-mcp = "livechat_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["livechat_mcp"]
